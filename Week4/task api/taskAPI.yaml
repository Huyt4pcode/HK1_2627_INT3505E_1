openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
  description: Quản lý task nội bộ
servers:
  - url: 'http://localhost:5000/v1'
security:
  - bearerAuth: []
tags:
  - name: tasks

paths:
  /tasks:
    get:
      operationId: listTasks
      tags:
        - tasks
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          $ref: '#/components/responses/TaskPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTask
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
            example:
              title: "cinema date with my gf"
              dueDate: "2026-10-30"
              priority: "high"
      responses:
        '201':
          $ref: '#/components/responses/TaskResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/{taskId}:
    parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTaskById
      tags:
        - tasks
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
    patch:
      operationId: patchTask
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
            example:
              title: "update cong viec trong tuan"
              status: "done"
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
    delete:
      operationId: deleteTask
      tags:
        - tasks
      responses:
        '204':
          description: Xóa thành công, không trả về body

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      
  schemas:
    TaskStatus:
      type: string
      enum: [open, done]

    TaskPriority:
      type: string
      enum: [low, normal, high]

    Task:
      type: object
      required: [id, title]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date
        assigneeId:
          type: string
          format: uuid
          
    CreateTaskInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date
        assigneeId:
          type: string
          format: uuid

    UpdateTaskInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date
        assigneeId:
          type: string
          format: uuid

  parameters:
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/TaskStatus'

  responses:
    TaskResponse:
      description: Thông tin chi tiết của task
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Task'
    TaskPage:
      description: Danh sách task
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Task'
    Unauthorized:
      description: Lỗi xác thực
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ